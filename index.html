<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a10">
  <title>NOVA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #070a10;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: white;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      height: 70px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background: #080b12;
      border-bottom: 1px solid #202532;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 21px;
      font-weight: 700;
    }

    .logo-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #06b6d4
        );

      box-shadow:
        0 0 25px rgba(124, 58, 237, .35);
    }

    .status {
      color: #6ee7b7;
      font-size: 13px;
    }

    /* CHAT */

    .chat {
      flex: 1;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 25px 15px 130px;

      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 700px;
      margin: 10vh auto 0;

      text-align: center;
    }

    .welcome-icon {
      width: 80px;
      height: 80px;

      margin: auto;

      display: grid;
      place-items: center;

      border-radius: 24px;

      font-size: 36px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #06b6d4
        );

      box-shadow:
        0 0 45px rgba(124, 58, 237, .35);
    }

    .welcome h1 {
      margin-top: 25px;

      font-size:
        clamp(32px, 8vw, 52px);
    }

    .welcome p {
      margin-top: 12px;

      color: #8b93a5;

      font-size: 16px;
    }

    /* MESSAGE */

    .message {
      width: 100%;
      max-width: 760px;

      margin: 18px auto;

      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;

      padding: 14px 17px;

      border-radius: 18px;

      line-height: 1.65;

      white-space: pre-wrap;
      word-break: break-word;

      font-size: 16px;
    }

    .user .bubble {
      background: #26304a;
    }

    .ai .bubble {
      background: #111621;

      border: 1px solid #202838;
    }

    .loading {
      opacity: .65;
    }

    /* INPUT */

    .input-area {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        15px
        15px
        calc(15px + env(safe-area-inset-bottom));

      background:
        linear-gradient(
          transparent,
          #070a10 25%
        );
    }

    .input-box {
      width: 100%;
      max-width: 760px;

      margin: auto;

      display: flex;
      align-items: flex-end;

      gap: 8px;

      padding: 9px;

      border:
        1px solid #303747;

      border-radius: 22px;

      background: #10141d;

      box-shadow:
        0 10px 40px rgba(0,0,0,.4);
    }

    textarea {
      flex: 1;

      min-height: 45px;
      max-height: 120px;

      resize: none;

      border: 0;
      outline: none;

      background: transparent;

      color: white;

      padding: 10px;

      line-height: 1.4;
    }

    textarea::placeholder {
      color: #687184;
    }

    .send {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      border: 0;

      border-radius: 15px;

      color: white;

      font-size: 20px;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #06b6d4
        );
    }

    .send:disabled {
      opacity: .5;
      cursor: default;
    }

    .send:active {
      transform: scale(.94);
    }

    @media (max-width: 600px) {

      .header {
        padding: 0 15px;
      }

      .chat {
        padding-left: 10px;
        padding-right: 10px;
      }

      .bubble {
        max-width: 90%;
      }

      .welcome {
        margin-top: 12vh;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">

      <div class="logo-icon">
        ✦
      </div>

      <span>NOVA AI</span>

    </div>

    <div class="status">
      ● Online
    </div>

  </header>


  <main
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        ✦
      </div>

      <h1>
        สวัสดีครับ 👋
      </h1>

      <p>
        ผมคือ NOVA ผู้ช่วย AI ของคุณ
      </p>

    </div>

  </main>


  <div class="input-area">

    <div class="input-box">

      <textarea
        id="input"
        rows="1"
        placeholder="ถามอะไร NOVA ก็ได้..."
      ></textarea>

      <button
        id="send"
        class="send"
        type="button"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");


function addMessage(text, type) {

  if (welcome) {
    welcome.style.display = "none";
  }

  const message =
    document.createElement("div");

  message.className =
    "message " + type;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  bubble.textContent = text;


  message.appendChild(bubble);

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;


  return message;
}


async function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  addMessage(
    text,
    "user"
  );


  input.value = "";

  input.style.height = "auto";


  send.disabled = true;


  const loading =
    addMessage(
      "NOVA กำลังคิด...",
      "ai"
    );


  loading
    .querySelector(".bubble")
    .classList.add("loading");


  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: text
            })
        }
      );


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "เกิดข้อผิดพลาดจาก API"
      );

    }


    addMessage(
      data.reply ||
      "NOVA ไม่มีคำตอบ",
      "ai"
    );


  } catch (error) {

    loading.remove();


    addMessage(
      "เกิดข้อผิดพลาด: " +
      error.message,
      "ai"
    );

  } finally {

    send.disabled = false;

    input.focus();

  }

}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();

    }

  }
);


input.addEventListener(
  "input",
  function() {

    this.style.height =
      "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        120
      ) + "px";

  }
);

</script>

</body>
</html>
