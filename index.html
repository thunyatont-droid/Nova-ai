<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #070a10;
  color: white;
  height: 100vh;
  overflow: hidden;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid #202532;
  background: rgba(8,11,18,.92);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: 700;
}

.logo-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow: 0 0 25px rgba(124,58,237,.35);
}

.status {
  font-size: 12px;
  color: #6ee7b7;
}

/* Chat */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 18px 120px;
}

.welcome {
  max-width: 760px;
  margin: 10vh auto 0;
  text-align: center;
}

.welcome-icon {
  width: 80px;
  height: 80px;
  margin: auto;
  border-radius: 25px;
  display: grid;
  place-items: center;
  font-size: 36px;
  background: linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow: 0 0 45px rgba(124,58,237,.35);
}

.welcome h1 {
  margin-top: 25px;
  font-size: clamp(32px,6vw,52px);
}

.welcome p {
  margin-top: 12px;
  color: #8b93a5;
}

.message {
  max-width: 760px;
  margin: 18px auto;
  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 80%;
  padding: 14px 17px;
  border-radius: 18px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.user .bubble {
  background: #26304a;
}

.ai .bubble {
  background: #111621;
  border: 1px solid #202838;
}

/* Input */
.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 15px 18px 22px;
  background: linear-gradient(transparent,#070a10 25%);
}

.input-box {
  max-width: 760px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 1px solid #303747;
  border-radius: 22px;
  background: #10141d;
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

textarea {
  flex: 1;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: white;
  font-size: 16px;
  padding: 10px;
  min-height: 44px;
  max-height: 120px;
}

textarea::placeholder {
  color: #687184;
}

.send {
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 15px;
  color: white;
  font-size: 20px;
  cursor: pointer;
  background: linear-gradient(135deg,#7c3aed,#06b6d4);
}

.send:active {
  transform: scale(.94);
}

@media(max-width:600px) {
  .header {
    padding: 0 15px;
  }

  .chat {
    padding-left: 12px;
    padding-right: 12px;
  }

  .bubble {
    max-width: 88%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span>NOVA AI</span>
    </div>

    <div class="status">● Local AI</div>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>

      <h1>สวัสดีครับ 👋</h1>

      <p>
        ผมคือ NOVA ผู้ช่วย AI ส่วนตัวของคุณ
      </p>
    </div>

  </main>

  <div class="input-area">
    <div class="input-box">

      <textarea
        id="input"
        placeholder="ถามอะไร NOVA ก็ได้..."
        rows="1"></textarea>

      <button class="send" onclick="sendMessage()">➤</button>

    </div>
  </div>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

function addMessage(text, type) {

  if (welcome) {
    welcome.style.display = "none";
  }

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  // ตอนนี้ยังเป็นระบบทดลอง
  setTimeout(() => {

    addMessage(
      "สวัสดีครับ ผมคือ NOVA ✦\n\nตอนนี้หน้าเว็บของผมพร้อมแล้ว แต่เรายังไม่ได้เชื่อมต่อโมเดล AI จริงครับ",
      "ai"
    );

  }, 700);
}

input.addEventListener("keydown", function(e) {

  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }

});

</script>

</body>
</html>
