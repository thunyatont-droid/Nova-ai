<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const sendButton = document.querySelector(".send");

function addMessage(text, type) {
  if (welcome) {
    welcome.style.display = "none";
  }

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return bubble;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text) return;

  // แสดงข้อความของผู้ใช้
  addMessage(text, "user");

  // ล้างช่องพิมพ์
  input.value = "";

  // ปิดปุ่มชั่วคราว
  sendButton.disabled = true;
  sendButton.style.opacity = "0.5";

  // แสดงสถานะกำลังคิด
  const loadingBubble = addMessage("NOVA กำลังคิด...", "ai");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error || "ไม่สามารถเชื่อมต่อ Gemini ได้"
      );
    }

    // เปลี่ยนข้อความ Loading เป็นคำตอบจริง
    loadingBubble.textContent =
      data.reply || "NOVA ไม่ได้รับคำตอบจาก Gemini";

  } catch (error) {

    console.error("NOVA API Error:", error);

    loadingBubble.textContent =
      "เกิดข้อผิดพลาดในการเชื่อมต่อ NOVA\n\n" +
      error.message;

  } finally {

    sendButton.disabled = false;
    sendButton.style.opacity = "1";

    chat.scrollTop = chat.scrollHeight;
  }
}

input.addEventListener("keydown", function(e) {

  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }

});
</script>
